// Repackages BladeMasterGabe/practical-config (Redfish247's 26.2 fork) with its `config.practical`
// package renamed to `fishmod.shaded.practicalconfig`, so FishMod's copy of the library can never
// collide with another mod's own bundled copy at the same package name. blade-addons ships its own
// (different) practical-config under the identical `config.practical` package — whichever copy the
// Fabric classloader resolves first "wins" globally, which crashed FishMod's ConfigManager
// reflecting into blade's incompatible class layout: java.lang.InstantiationError:
// config.practical.hud.HUDComponent. See dungeons-26.1.2/build.gradle, where this is included as a
// jar-in-jar project dependency (Loom's `include()` needs a real module/project component — a
// relocated `files()` artifact alone isn't accepted).
plugins {
	id 'java'
	id 'com.gradleup.shadow' version '9.6.1'
}

group = project.maven_group
version = project.practical_config

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	// Exclude fabric-loader/fabric-api transitives: those are Minecraft/Fabric API surfaces already
	// provided by whichever real mod project (dungeons-26.1.2) bundles this shim at runtime — this
	// plain `java` subproject has no Fabric Loom repos/toolchain to resolve them against.
	implementation("com.github.Redfish247:practical-config:${project.practical_config}") {
		exclude group: 'net.fabricmc'
		exclude group: 'net.fabricmc.fabric-api'
	}
}

shadowJar {
	archiveClassifier = ''
	// Not used by FishMod (see practical-config research notes) and its @Mixin annotation trips a
	// Type-array annotation remapping bug in some shadow/ASM versions.
	exclude 'config/practical/mixin/**'
	// Strip the upstream fabric.mod.json/mixin configs entirely: as shipped they declare this jar as
	// its own Fabric mod with id "practical-config" — the same id blade-addons' own bundled copy of
	// the (unrelocated) library uses, so Fabric Loader's nested-jar loading collided the two, and the
	// mixin configs' "required: true" ExampleMixin/ExampleClientMixin also point at relocated/excluded
	// classes now. FishMod only needs the plain library classes (see practical-config research notes:
	// ConfigManager/ConfigValue/HUDComponent/SoundData) — dropping the metadata makes this a plain
	// jar-in-jar library, like the NanoVG include() above it, instead of a second competing mod.
	exclude 'fabric.mod.json'
	exclude 'practical-config.mixins.json'
	exclude 'practical-config.client.mixins.json'
	relocate 'config.practical', 'fishmod.shaded.practicalconfig'
	// HUDComponent hardcodes Practicalconfig.MOD_ID ("practical-config") as the namespace for
	// Identifier.of(MOD_ID, "component-" + n) when it registers itself into Minecraft's global
	// HudElementRegistry. That registry is keyed by Identifier and shared across every mod on the
	// classpath — package relocation doesn't touch this, since it's a raw string literal, not a class
	// name — so FishMod's copy and blade-addons' own (unrelocated) copy both tried to register
	// "practical-config:component-0" and Minecraft rejected the duplicate with
	// IllegalArgumentException: Layer with identifier practical-config:component-0 already exists.
	relocate(new com.github.jengelman.gradle.plugins.shadow.relocation.SimpleRelocator(
		'practical-config', 'fishmod-shaded-practicalconfig', [], [], true, false
	))
}

tasks.jar {
	enabled = false
}

// Make shadowJar's relocated output the artifact this project publishes to dependents (instead of
// the plain, unrelocated `jar` task output) so `include implementation project(':practical-config-relocated')`
// bundles the relocated classes.
configurations {
	[apiElements, runtimeElements].each {
		it.outgoing.artifacts.clear()
		it.outgoing.artifact(tasks.shadowJar)
	}
}

tasks.assemble.dependsOn tasks.shadowJar
