org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

org.gradle.configuration-cache=false

maven_group=fishmod
mod_version_base=1.0.0

# Shared across common + both dungeons-* modules (the dungeon map feature is written in Kotlin).
# Version pinned to match odtheking/Odin's own known-good combo (already resolvable from the local
# Gradle cache).
kotlin_version=2.3.20

# Fork of BladeMasterGabe/practical-config; 1.5.0-26.1.2 tag is the last verified-good commit
# before the 26.2-only Minecraft.setScreen() relocation fix (upstream has no 26.x release yet).
# Shared with :practical-config-relocated, which repackages it for dungeons-26.1.2 to bundle as a
# jar-in-jar (see that project's build.gradle for why) — lives at the root so both projects see it.
practical_config=1.5.0-26.1.2
