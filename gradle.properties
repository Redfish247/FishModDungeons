# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

maven_group=fishmod
mod_version_base=1.0.0

# Shared across common + both dungeons-* modules (the dungeon map feature is written in Kotlin).
# Version pinned to match odtheking/Odin's own known-good combo (already resolvable from the local
# Gradle cache).
kotlin_version=2.3.20
